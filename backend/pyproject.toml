[project]
name = "healthcare-app"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "cryptography>=43",
    "langsmith>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain>=1.0,<2",
    "langchain-google-genai>=3,<4",
    "langchain-groq>=1,<2",
    "langgraph>=1.0,<2",
    "pypdf>=5",
    "python-multipart>=0.0.9",
    "httpx>=0.27",  # WhatsApp Graph API client
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs GOOGLE_API_KEY and network"]

[tool.ruff.lint.per-file-ignores]
# ported explainer code keeps its original line lengths so diffs against 811eb54 stay readable
"app/brain/*" = ["E501"]
"tests/brain/*" = ["E501"]
