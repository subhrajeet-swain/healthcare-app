services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: migrations (and dev seed) run with owner credentials, then exit.
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hc_app:app_dev@db:5432/healthcare
      OWNER_DATABASE_URL: postgresql://hc_owner:owner_dev@db:5432/healthcare
      GRAPH_DATABASE_URL: postgresql://hc_graph:graph_dev@db:5432/healthcare
    command: sh -c "python -m app.migrate && python -m app.seed"
    depends_on:
      db:
        condition: service_healthy

  # The API only ever holds the restricted hc_app role (NOBYPASSRLS, not table owner).
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hc_app:app_dev@db:5432/healthcare
      OWNER_DATABASE_URL: ""
      GRAPH_DATABASE_URL: ""
      ADMIN_DATABASE_URL: ""
      STORAGE_DIR: /files
    volumes:
      - files:/files
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Runs the report pipeline. Restricted roles only: hc_worker for data, hc_graph for checkpoints.
  worker:
    build: ./backend
    env_file: .env
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://hc_worker:worker_dev@db:5432/healthcare
      WORKER_DATABASE_URL: postgresql://hc_worker:worker_dev@db:5432/healthcare
      GRAPH_DATABASE_URL: postgresql://hc_graph:graph_dev@db:5432/healthcare
      OWNER_DATABASE_URL: ""
      ADMIN_DATABASE_URL: ""
      STORAGE_DIR: /files
    volumes:
      - files:/files
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      API_URL: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - web_node_modules:/web/node_modules
    depends_on:
      - api

volumes:
  files:
  pgdata:
  web_node_modules:
